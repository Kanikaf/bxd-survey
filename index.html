<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BxD 戦力アンケート</title>
<style>
  :root {
    --bg: #0f1420;
    --panel: #1a2233;
    --panel-border: #2c3852;
    --accent: #4f8cff;
    --accent-dark: #3468d4;
    --text: #eaf0ff;
    --text-dim: #9aa8c7;
    --error: #ff6b6b;
    --success: #4fd18b;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    background: radial-gradient(circle at top, #182238 0%, var(--bg) 60%);
    font-family: "Hiragino Sans", "Yu Gothic", "Segoe UI", sans-serif;
    color: var(--text);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px 16px;
  }
  .card {
    width: 100%;
    max-width: 420px;
    background: var(--panel);
    border: 1px solid var(--panel-border);
    border-radius: 16px;
    padding: 28px 24px 24px;
    box-shadow: 0 20px 50px rgba(0,0,0,0.35);
  }
  .header {
    text-align: center;
    margin-bottom: 24px;
  }
  .header .tag {
    display: inline-block;
    font-size: 12px;
    letter-spacing: 0.15em;
    color: var(--accent);
    border: 1px solid var(--accent);
    border-radius: 999px;
    padding: 3px 12px;
    margin-bottom: 10px;
  }
  .header h1 {
    font-size: 20px;
    margin: 0;
  }
  .header p {
    margin: 8px 0 0;
    font-size: 13px;
    color: var(--text-dim);
  }
  label {
    display: block;
    font-size: 13px;
    color: var(--text-dim);
    margin: 18px 0 6px;
  }
  input[type="text"],
  input[type="number"],
  select {
    width: 100%;
    padding: 12px 14px;
    border-radius: 10px;
    border: 1px solid var(--panel-border);
    background: #101828;
    color: var(--text);
    font-size: 15px;
    outline: none;
    transition: border-color 0.15s;
    -moz-appearance: none;
    -webkit-appearance: none;
    appearance: none;
  }
  select {
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 20 20' fill='%239aa8c7'><path d='M5 7l5 5 5-5z'/></svg>");
    background-repeat: no-repeat;
    background-position: right 14px center;
    background-size: 16px;
  }
  input:focus, select:focus {
    border-color: var(--accent);
  }

  /* ---- 名前モード切り替えタブ ---- */
  .mode-group {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 8px;
    margin-top: 6px;
  }
  .mode-option { position: relative; }
  .mode-option input {
    position: absolute;
    opacity: 0;
    width: 100%;
    height: 100%;
    margin: 0;
    cursor: pointer;
  }
  .mode-option span {
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 10px 4px;
    border-radius: 10px;
    border: 1px solid var(--panel-border);
    background: #101828;
    font-size: 13px;
    text-align: center;
    transition: all 0.15s;
    line-height: 1.3;
  }
  .mode-option input:checked + span {
    border-color: var(--accent);
    background: rgba(79,140,255,0.15);
    color: #fff;
    font-weight: 600;
  }
  .name-panel { display: none; margin-top: 10px; }
  .name-panel.active { display: block; }
  .hint {
    font-size: 11px;
    color: var(--text-dim);
    margin-top: 6px;
  }
  .hint.warn { color: var(--error); }

  .branch-group {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 8px;
    margin-top: 6px;
  }
  .branch-option {
    position: relative;
  }
  .branch-option input {
    position: absolute;
    opacity: 0;
    width: 100%;
    height: 100%;
    margin: 0;
    cursor: pointer;
  }
  .branch-option span {
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 12px 4px;
    border-radius: 10px;
    border: 1px solid var(--panel-border);
    background: #101828;
    font-size: 13px;
    text-align: center;
    transition: all 0.15s;
  }
  .branch-option input:checked + span {
    border-color: var(--accent);
    background: rgba(79,140,255,0.15);
    color: #fff;
    font-weight: 600;
  }
  .power-group {
    display: flex;
    align-items: stretch;
    gap: 8px;
  }
  .power-group input {
    flex: 1;
    min-width: 0;
  }
  .power-unit {
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 0 16px;
    border-radius: 10px;
    border: 1px solid var(--panel-border);
    background: #0b1220;
    color: var(--text-dim);
    font-size: 14px;
    font-weight: 600;
    letter-spacing: 0.05em;
  }
  button {
    width: 100%;
    margin-top: 26px;
    padding: 14px;
    border: none;
    border-radius: 10px;
    background: var(--accent);
    color: #fff;
    font-size: 16px;
    font-weight: 600;
    cursor: pointer;
    transition: background 0.15s, transform 0.1s;
  }
  button:hover { background: var(--accent-dark); }
  button:active { transform: scale(0.98); }
  button:disabled {
    opacity: 0.6;
    cursor: not-allowed;
  }
  .msg {
    margin-top: 14px;
    font-size: 13px;
    text-align: center;
    min-height: 18px;
  }
  .msg.error { color: var(--error); }
  .msg.success { color: var(--success); }
  .footer-note {
    margin-top: 18px;
    font-size: 11px;
    color: var(--text-dim);
    text-align: center;
  }
</style>
</head>
<body>

<div class="card">
  <div class="header">
    <span class="tag">BxD</span>
    <h1>戦力アンケート</h1>
    <p>名前・兵科・1軍戦力を入力してください</p>
  </div>

  <form id="surveyForm">

    <label>名前の入力方法</label>
    <div class="mode-group">
      <label class="mode-option">
        <input type="radio" name="nameMode" value="existing" checked>
        <span>連盟リストから選択</span>
      </label>
      <label class="mode-option">
        <input type="radio" name="nameMode" value="new">
        <span>新規で名前を登録</span>
      </label>
    </div>

    <div class="name-panel active" id="panelExisting">
      <label for="existingName">名前（リストから選択）</label>
      <select id="existingName">
        <option value="">読み込み中...</option>
      </select>
      <div class="hint" id="listHint"></div>
    </div>

    <div class="name-panel" id="panelNew">
      <label for="newName">名前（新規・ゲーム内名）</label>
      <input type="text" id="newName" placeholder="例）カニカフ">
      <div class="hint" id="newNameHint"></div>
    </div>

    <label>兵科</label>
    <div class="branch-group">
      <label class="branch-option">
        <input type="radio" name="branch" value="戦車" required>
        <span>戦車</span>
      </label>
      <label class="branch-option">
        <input type="radio" name="branch" value="航空">
        <span>航空</span>
      </label>
      <label class="branch-option">
        <input type="radio" name="branch" value="ロケラン">
        <span>ロケラン</span>
      </label>
    </div>

    <label for="power">1軍戦力</label>
    <div class="power-group">
      <input type="text" id="power" placeholder="85.0" inputmode="decimal" required>
      <span class="power-unit">M</span>
    </div>

    <button type="submit" id="submitBtn">送信する</button>
    <div class="msg" id="msg"></div>
  </form>

  <div class="footer-note">送信内容はカニカフスプレッドシートに記録されます</div>
</div>

<script>
  // ↓↓↓ Apps Scriptで発行したウェブアプリURL（.../exec） ↓↓↓
  const GAS_URL = "https://script.google.com/macros/s/AKfycbzkFpCjYsqnM3tTfRYXHvEFMDx3OL0MW1WQ9UsjIwlTLcytyvXkQUIFoxg-kvnsYA0R/exec";

  const form = document.getElementById('surveyForm');
  const msg = document.getElementById('msg');
  const btn = document.getElementById('submitBtn');

  const existingSelect = document.getElementById('existingName');
  const newNameInput = document.getElementById('newName');
  const newNameHint = document.getElementById('newNameHint');
  const listHint = document.getElementById('listHint');
  const panelExisting = document.getElementById('panelExisting');
  const panelNew = document.getElementById('panelNew');

  const branchRadios = form.querySelectorAll('input[name="branch"]');
  const powerInput = document.getElementById('power');

  // name -> {branch, power} のマップ（既存選択時に現在値を自動入力するため）
  let playerMap = {};
  let nameListLoaded = false;
  let existingNamesLower = [];

  // ---- 名前モード切り替え ----
  form.querySelectorAll('input[name="nameMode"]').forEach(function (radio) {
    radio.addEventListener('change', function () {
      if (this.value === 'existing') {
        panelExisting.classList.add('active');
        panelNew.classList.remove('active');
      } else {
        panelNew.classList.add('active');
        panelExisting.classList.remove('active');
      }
      msg.textContent = '';
      msg.className = 'msg';
    });
  });

  // ---- 連盟リスト取得 ----
  fetch(GAS_URL + '?action=list')
    .then(function (res) { return res.json(); })
    .then(function (data) {
      if (!data || !data.ok || !Array.isArray(data.players)) {
        throw new Error('list format error');
      }
      playerMap = {};
      existingSelect.innerHTML = '<option value="">選択してください</option>';
      data.players
        .slice()
        .sort(function (a, b) { return a.name.localeCompare(b.name, 'ja'); })
        .forEach(function (p) {
          playerMap[p.name] = { branch: p.branch, power: p.power };
          existingNamesLower.push(p.name.trim().toLowerCase());
          const opt = document.createElement('option');
          opt.value = p.name;
          opt.textContent = p.name;
          existingSelect.appendChild(opt);
        });
      nameListLoaded = true;
      listHint.textContent = '';
    })
    .catch(function () {
      existingSelect.innerHTML = '<option value="">取得に失敗しました</option>';
      listHint.textContent = 'リストの取得に失敗しました。「新規で名前を登録」から入力するか、時間をおいて再度お試しください。';
      listHint.classList.add('warn');
    });

  // 既存名を選んだら、現在の兵科・戦力を自動入力（上書きしたい値だけ変更すればOK）
  existingSelect.addEventListener('change', function () {
    const p = playerMap[this.value];
    if (!p) return;
    if (p.branch) {
      branchRadios.forEach(function (r) { r.checked = (r.value === p.branch); });
    }
    if (p.power !== undefined && p.power !== '') {
      powerInput.value = p.power;
    }
  });

  // 新規名入力時、既存リストと完全一致したら警告してブロック
  newNameInput.addEventListener('input', function () {
    const v = this.value.trim().toLowerCase();
    if (v && existingNamesLower.indexOf(v) !== -1) {
      newNameHint.textContent = 'この名前は既に連盟リストにあります。「連盟リストから選択」を使ってください。';
      newNameHint.classList.add('warn');
    } else {
      newNameHint.textContent = '';
      newNameHint.classList.remove('warn');
    }
  });

  form.addEventListener('submit', function (e) {
    e.preventDefault();

    const mode = form.querySelector('input[name="nameMode"]:checked').value;
    let name = '';

    if (mode === 'existing') {
      name = existingSelect.value.trim();
      if (!name) {
        msg.textContent = '名前をリストから選択してください';
        msg.className = 'msg error';
        return;
      }
    } else {
      name = newNameInput.value.trim();
      if (!name) {
        msg.textContent = '名前を入力してください';
        msg.className = 'msg error';
        return;
      }
      if (existingNamesLower.indexOf(name.toLowerCase()) !== -1) {
        msg.textContent = 'この名前は既にリストにあります。「連盟リストから選択」を使ってください';
        msg.className = 'msg error';
        return;
      }
    }

    const branchEl = form.querySelector('input[name="branch"]:checked');
    const power = powerInput.value.trim();

    if (!branchEl || !power) {
      msg.textContent = '未入力の項目があります';
      msg.className = 'msg error';
      return;
    }

    const payload = {
      name: name,
      branch: branchEl.value,
      power: power   // GAS側で数値(M単位)として保存
    };

    btn.disabled = true;
    btn.textContent = '送信中...';
    msg.textContent = '';
    msg.className = 'msg';

    // GASのCORSプリフライト回避のため text/plain で送信（GAS側でJSON.parseする）
    fetch(GAS_URL, {
      method: 'POST',
      mode: 'no-cors',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify(payload)
    })
      .then(function () {
        // no-cors のためレスポンス内容は読めない → 通信自体が成功したら完了とみなす
        msg.textContent = '送信しました。ありがとうございます！';
        msg.className = 'msg success';

        // 新規登録した名前は次回から選べるようローカルのリストにも反映
        if (mode === 'new') {
          const opt = document.createElement('option');
          opt.value = name;
          opt.textContent = name;
          existingSelect.appendChild(opt);
          existingNamesLower.push(name.toLowerCase());
          playerMap[name] = { branch: payload.branch, power: payload.power };
        }

        form.querySelectorAll('input[name="branch"]').forEach(function (r) { r.checked = false; });
        powerInput.value = '';
        newNameInput.value = '';
        newNameHint.textContent = '';
      })
      .catch(function () {
        msg.textContent = '送信に失敗しました。通信環境を確認してください。';
        msg.className = 'msg error';
      })
      .finally(function () {
        btn.disabled = false;
        btn.textContent = '送信する';
      });
  });
</script>

</body>
</html>
